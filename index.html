<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildBills Clipart Vault - Premium Graphic Assets</title>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .hero { text-align: center; padding: 60px 20px; background: #111; border-bottom: 1px solid #261010; }
        .hero h1 { color: #e74c3c; font-size: 36px; text-transform: uppercase; margin: 0 0 10px 0; }
        .hero p { color: #aaa; font-size: 16px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .category-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; min-height: 200px; }
        footer { background: #111; padding: 40px 20px; text-align: center; border-top: 1px solid #261010; font-size: 13px; color: #666; }
        footer a { color: #aaa; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>

<div class="hero">
    <h1>Browse Categories</h1>
    <p>Select a category to filter your 120 premium clipart design packs.</p>
</div>

<div class="container">
    <div id="vault-filter-bar" style="text-align:center; margin:0 auto 40px auto; display:flex; flex-wrap:wrap; justify-content:center; gap:10px;"></div>
    <div class="category-grid" id="main-catalog-grid">
        <div style="color:#aaa; font-style:italic; padding:40px;">Syncing with secure storage array vaults...</div>
    </div>
</div>

<script>
(function() {
    console.log("[VAULT ENGINE] Initializing secure categorized catalog routing...");
    const gridContainer = document.getElementById('main-catalog-grid');
    const filterBar = document.getElementById('vault-filter-bar');

    fetch('https://api-clipart.wildbillsproplans.com/static/products.json')
        .then(res => {
            if (!res.ok) throw new Error("HTTP connection fault: " + res.status);
            return res.json();
        })
        .then(data => {
            if (data.status === "success" && data.categories) {
                filterBar.innerHTML = '';
                gridContainer.innerHTML = '';
                const categoryKeys = Object.keys(data.categories);

                categoryKeys.forEach((catName, index) => {
                    const btn = document.createElement('button');
                    btn.innerText = catName;
                    btn.style.cssText = "padding:10px 20px; font-weight:bold; background:#141414; border:1px solid #261010; color:#fff; cursor:pointer; border-radius:4px; text-transform:uppercase; font-size:12px; margin:5px;";
                    
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('#vault-filter-bar button').forEach(b => {
                            b.style.background = "#141414";
                            b.style.borderColor = "#261010";
                        });
                        btn.style.background = "#e74c3c";
                        btn.style.borderColor = "#e74c3c";
                        renderCategoryCards(data.categories[catName], gridContainer);
                    });

                    filterBar.appendChild(btn);
                    if (index === 0) btn.click();
                });
            } else {
                gridContainer.innerHTML = '<div style="color:#e74c3c; padding:20px;">No categories found in data maps.</div>';
            }
        })
        .catch(err => {
            console.error("[VAULT CRASH]", err);
            gridContainer.innerHTML = '<div style="color:#e74c3c; padding:20px;">Handshake error over tunnel.</div>';
        });

    function renderCategoryCards(productArray, container) {
        container.innerHTML = '';
        if (!productArray || productArray.length === 0) {
            container.innerHTML = '<div style="color:#aaa; padding:20px;">No bundles inside this category.</div>';
            return;
        }
        productArray.forEach(prodId => {
            const displayTitle = prodId.replace(/_/g, ' ').toUpperCase();
            const cardHtml = `
                <div class="product-card" style="background:#141414; padding:20px; border:1px solid #261010; border-radius:6px; margin:10px; text-align:center; display:inline-block; width:280px; vertical-align:top;">
                    <img src="https://wildbillsproplans.com{prodId}_Storefront_Preview.png" alt="${displayTitle}" style="max-width:100%; border-radius:4px; margin-bottom:15px;" onerror="this.onerror=null; this.src='https://wildbillsproplans.com';">
                    <h3 style="color:#e74c3c; font-size:14px; margin-bottom:10px; min-height:40px;">${displayTitle}</h3>
                    <button class="buy-button" data-product-id="${prodId}" style="width:100%; padding:10px; background:#e74c3c; color:#fff; border:none; font-weight:bold; text-transform:uppercase; border-radius:4px; cursor:pointer;">Buy Pack - $20.00</button>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }
})();
</script>
</body>
</html>

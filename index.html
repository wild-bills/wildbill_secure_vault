<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Bill Clipart Vault</title>
    <style>
        :root {
            --bg: #0c0808;
            --panel: #151010;
            --border: #2a1d1d;
            --text: #f5f2f2;
            --muted: #b3a5a5;
            --accent: #ef4a3b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--text);
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0c0808 0%, #090606 100%);
        }

        .hero {
            text-align: center;
            padding: 56px 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            color: var(--accent);
            letter-spacing: 0.03em;
        }

        .hero p {
            color: var(--muted);
            margin: 10px 0 0;
        }

        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .filter-btn {
            padding: 10px 16px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: #181212;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            min-height: 180px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .thumb {
            width: 100%;
            height: 190px;
            border-radius: 6px;
            object-fit: contain;
            background: #0f0a0a;
            display: block;
            margin-bottom: 12px;
        }

        .title {
            margin: 0 0 6px;
            color: var(--accent);
            font-size: 14px;
            min-height: 36px;
        }

        .sku {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .price {
            margin: 0 0 12px;
            color: #fff;
            font-weight: 700;
        }

        .buy-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 4px;
        }

        .status {
            color: var(--muted);
            text-align: center;
            padding: 24px;
        }

        .error {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>BROWSE CATEGORIES</h1>
        <p>Select a category to filter your premium clipart bundles.</p>
    </header>

    <main class="wrap">
        <div id="filter-bar" class="filter-bar"></div>
        <div id="catalog-grid" class="grid">
            <div class="status">Loading catalog...</div>
        </div>
    </main>

    <script>
        (function() {
            const filterBar = document.getElementById('filter-bar');
            const grid = document.getElementById('catalog-grid');
            let catalogOrigin = window.location.origin;

            const catalogEndpoints = [
                '/catalog.json',
                'https://api-clipart.wildbillsproplans.com/catalog.json'
            ];

            function escapeHtml(value) {
                return String(value || '')
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#39;');
            }

            function normalizePreview(url) {
                const value = String(url || '');
                if (!value) {
                    return '';
                }
                if (value.startsWith('http://') || value.startsWith('https://')) {
                    return value;
                }
                if (value.startsWith('/')) {
                    return catalogOrigin + value;
                }
                return value;
            }

            function renderCards(items) {
                if (!Array.isArray(items) || items.length === 0) {
                    grid.innerHTML = '<div class="status">No bundles found for this category.</div>';
                    return;
                }

                grid.innerHTML = items.map((item) => {
                    const title = item.name || item.sku || 'Bundle';
                    const sku = item.sku || '';
                    const price = item.price || '10.00';
                    const preview = normalizePreview((item.previews && item.previews[0]) || '');
                    const buyHref = sku
                        ? catalogOrigin + '/product/' + encodeURIComponent(sku)
                        : catalogOrigin + '/contact';

                    return `
                        <article class="card">
                            ${preview ? `<img class="thumb" src="${escapeHtml(preview)}" alt="${escapeHtml(title)}" onerror="this.style.display='none'">` : ''}
                            <h2 class="title">${escapeHtml(title)}</h2>
                            <p class="sku">${sku ? 'SKU: ' + escapeHtml(sku) : ''}</p>
                            <p class="price">$${escapeHtml(price)}</p>
                            <a class="buy-btn" href="${buyHref}">Buy Bundle</a>
                        </article>
                    `;
                }).join('');
            }

            function renderCategories(categories) {
                const names = Object.keys(categories || {});
                if (names.length === 0) {
                    grid.innerHTML = '<div class="status">No categories found.</div>';
                    return;
                }

                filterBar.innerHTML = '';

                names.forEach((name, index) => {
                    const button = document.createElement('button');
                    button.className = 'filter-btn';
                    button.textContent = name;

                    button.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach((node) => node.classList.remove('active'));
                        button.classList.add('active');
                        renderCards(categories[name]);
                    });

                    filterBar.appendChild(button);
                    if (index === 0) {
                        button.click();
                    }
                });
            }

            async function loadCatalog() {
                for (const endpoint of catalogEndpoints) {
                    try {
                        const response = await fetch(endpoint);
                        if (!response.ok) {
                            continue;
                        }
                        const data = await response.json();
                        if (data && data.status === 'success' && data.categories) {
                            catalogOrigin = new URL(endpoint, window.location.href).origin;
                            renderCategories(data.categories);
                            return;
                        }
                    } catch (error) {
                        console.error('Catalog load failed for', endpoint, error);
                    }
                }

                grid.innerHTML = '<div class="status error">Unable to load catalog from local or api-clipart source.</div>';
            }

            loadCatalog();
        })();
    </script>
</body>
</html>

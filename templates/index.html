<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Bill Secure Vault</title>
    <style>
        :root {
            --bg: #0b0707;
            --panel: #140c0c;
            --border: #2c1919;
            --text: #f4f1f1;
            --muted: #ae9f9f;
            --accent: #ff2e35;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--text);
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 46, 53, 0.14), transparent 30%),
                linear-gradient(180deg, #0b0707 0%, #080505 100%);
        }

        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
        }

        .hero {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: rgba(20, 12, 12, 0.82);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.9rem, 4vw, 3rem);
        }

        .sub {
            margin: 0;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
            overflow: hidden;
        }

        .thumb {
            height: 180px;
            background: #0d0909;
            padding: 10px;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: block;
        }

        .body {
            padding: 0.95rem;
        }

        .theme {
            margin: 0 0 0.4rem;
            color: var(--accent);
            font-size: 1.04rem;
        }

        .count {
            margin: 0 0 0.8rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(135deg, #c9151d 0%, var(--accent) 100%);
        }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="hero">
            <h1>Browse Vault Categories</h1>
            <p class="sub">Choose a category to view bundle previews and start checkout for a specific SKU.</p>
        </section>

        <section class="grid">
            {% for section in categories %}
            <article class="card">
                <div class="thumb">
                    {% if section.preview %}
                    <img src="{{ section.preview }}" alt="{{ section.theme }} preview" onerror="this.style.display='none'">
                    {% endif %}
                </div>
                <div class="body">
                    <h2 class="theme">{{ section.theme }}</h2>
                    <p class="count">{{ section.count }} bundle{{ '' if section.count == 1 else 's' }}</p>
                    <a class="btn" href="{{ url_for('category_view', theme_slug=section.slug) }}">View Bundles</a>
                </div>
            </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
